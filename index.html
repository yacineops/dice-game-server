<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة النرد</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#071f14;
}

.table{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at center,#176b43 0%,#0c4b2f 45%,#062b1b 100%);
    border:10px solid #5a321b;
}

.player{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
}

.player2{
    top:25px;
    transform:translateX(-50%) rotate(180deg);
}

.player1{
    bottom:25px;
}

.player-name{
    font-size:18px;
    font-weight:bold;
    color:white;
    text-shadow:0 2px 3px #000;
}

.active{
    padding:8px 14px;
    border:3px solid #ffd83d;
    border-radius:15px;
    box-shadow:0 0 18px #ffd83d;
}

.coins-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.coin-stack{
    width:45px;
    height:35px;
    position:relative;
}

.coin{
    position:absolute;
    width:38px;
    height:12px;
    border-radius:50%;
    background:linear-gradient(#ffe56b,#d99b00);
    border:2px solid #b87900;
    box-shadow:0 2px 2px #442800;
}

.coin-count{
    color:#ffd84a;
    font-size:25px;
    font-weight:bold;
    min-width:35px;
    text-align:center;
}

.dice-scene{
    position:absolute;
    left:50%;
    top:50%;
    width:60px;
    height:60px;
    transform:translate(-50%,-50%);
    perspective:500px;
}

.dice-shadow{
    position:absolute;
    width:55px;
    height:15px;
    left:3px;
    top:62px;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    filter:blur(4px);
}

.dice{
    width:60px;
    height:60px;
    position:relative;
    transform-style:preserve-3d;
    cursor:pointer;
}

.face{
    position:absolute;
    width:60px;
    height:60px;
    background:linear-gradient(145deg,#fff,#d7d7d7);
    border:2px solid #999;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:inset 0 0 8px rgba(0,0,0,.2);
}

.face1{transform:translateZ(30px);}
.face2{transform:rotateY(180deg) translateZ(30px);}
.face3{transform:rotateY(90deg) translateZ(30px);}
.face4{transform:rotateY(-90deg) translateZ(30px);}
.face5{transform:rotateX(90deg) translateZ(30px);}
.face6{transform:rotateX(-90deg) translateZ(30px);}

.dot{
    width:9px;
    height:9px;
    background:#111;
    border-radius:50%;
    position:absolute;
}

.one .d1{top:25px;left:25px;}

.two .d1{top:12px;left:12px;}
.two .d2{bottom:12px;right:12px;}

.three .d1{top:12px;left:12px;}
.three .d2{top:25px;left:25px;}
.three .d3{bottom:12px;right:12px;}

.four .d1{top:12px;left:12px;}
.four .d2{top:12px;right:12px;}
.four .d3{bottom:12px;left:12px;}
.four .d4{bottom:12px;right:12px;}

.five .d1{top:12px;left:12px;}
.five .d2{top:12px;right:12px;}
.five .d3{top:25px;left:25px;}
.five .d4{bottom:12px;left:12px;}
.five .d5{bottom:12px;right:12px;}

.six .d1{top:10px;left:12px;}
.six .d2{top:10px;right:12px;}
.six .d3{top:25px;left:12px;}
.six .d4{top:25px;right:12px;}
.six .d5{bottom:10px;left:12px;}
.six .d6{bottom:10px;right:12px;}

.dice.rolling{
    animation:dice3D 0.18s linear infinite;
}

@keyframes dice3D{
    0%{transform:rotateX(0) rotateY(0);}
    50%{transform:rotateX(180deg) rotateY(180deg);}
    100%{transform:rotateX(360deg) rotateY(360deg);}
}

#restart{
    position:absolute;
    right:10px;
    top:10px;
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#d7a514;
    color:white;
    font-size:25px;
    font-weight:bold;
    box-shadow:0 3px 8px #000;
    cursor:pointer;
    z-index:10;
}

#settingsButton{
    position:absolute;
    left:10px;
    top:10px;
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#555;
    color:white;
    font-size:23px;
    box-shadow:0 3px 8px #000;
    cursor:pointer;
    z-index:60;
}

#startScreen,
#friendScreen,
#roomScreen{
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.55);
}

#startScreen{
    z-index:20;
    display:flex;
}

#friendScreen,
#roomScreen{
    z-index:45;
    display:none;
}

.start-box,
.friend-box,
.room-box{
    width:280px;
    padding:25px 20px;
    border-radius:20px;
    background:#103d29;
    border:2px solid #d7a514;
    box-shadow:0 8px 30px #000;
    text-align:center;
    color:white;
}

.friend-box{
    border-color:#1877d2;
}

.room-box{
    border-color:#d7a514;
}

.start-box h2,
.friend-box h2,
.room-box h2{
    margin:0 0 18px;
}

.menu-button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 8px #000;
}

.online-button{
    background:#1877d2;
}

.local-button{
    background:#d7a514;
}

.friend-button{
    background:#8e44ad;
}

.create-room-button{
    background:#1877d2;
}

.join-room-button{
    background:#d7a514;
}

.back-button{
    background:#777;
}

#localSettings{
    display:none;
}

.coin-choice{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin:15px 0 22px;
}

.coin-choice button{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    font-size:25px;
    font-weight:bold;
    background:#d7a514;
    color:white;
}

#startingCoins{
    font-size:30px;
    font-weight:bold;
    color:#ffd84a;
    min-width:60px;
}

#startGame{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    background:#d7a514;
    color:white;
    font-size:18px;
    font-weight:bold;
}

#settingsScreen{
    position:absolute;
    inset:0;
    z-index:55;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.7);
}

.settings-box{
    width:280px;
    padding:25px 20px;
    border-radius:20px;
    background:#103d29;
    border:2px solid #888;
    box-shadow:0 8px 30px #000;
    text-align:center;
    color:white;
}

.settings-box h2{
    margin:0 0 20px;
}

#playerNameInput,
#roomCodeInput{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:18px;
    text-align:center;
    margin-bottom:15px;
}

#roomCodeInput{
    letter-spacing:4px;
    font-weight:bold;
}

.settings-button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:17px;
    font-weight:bold;
    margin-top:8px;
}

.save-name{
    background:#1877d2;
}

.close-settings{
    background:#777;
}

#onlineScreen{
    position:absolute;
    inset:0;
    z-index:40;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.65);
}

.online-box{
    width:280px;
    padding:30px 20px;
    border-radius:20px;
    background:#103d29;
    border:2px solid #1877d2;
    box-shadow:0 8px 30px #000;
    text-align:center;
    color:white;
}

.search-icon{
    font-size:48px;
    margin-bottom:10px;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.15);}
}

.online-box h2{
    margin:5px 0 10px;
}

.online-box p{
    color:#ddd;
    line-height:1.5;
}

#cancelOnline{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#777;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.room-code{
    font-size:35px;
    font-weight:bold;
    letter-spacing:7px;
    color:#ffd84a;
    margin:18px 0;
    direction:ltr;
}

.room-info{
    color:#ddd;
    line-height:1.6;
    margin-bottom:15px;
}

.flying-coin{
    position:fixed;
    width:20px;
    height:8px;
    border-radius:50%;
    background:#ffd84a;
    border:2px solid #b87900;
    z-index:15;
    pointer-events:none;
    animation:flyCoin .7s ease-in-out forwards;
}

@keyframes flyCoin{
    to{
        transform:translate(var(--dx),var(--dy)) scale(.6);
        opacity:0;
    }
}

.win-message{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.55);
}

.win-box{
    background:#123d28;
    border:3px solid #ffd84a;
    border-radius:20px;
    padding:25px 35px;
    color:white;
    text-align:center;
    font-size:25px;
    font-weight:bold;
    box-shadow:0 0 30px #ffd84a;
}

.win-box button{
    margin-top:18px;
    padding:10px 25px;
    border:none;
    border-radius:10px;
    background:#d7a514;
    color:white;
    font-size:17px;
}
</style>
</head>

<body>

<div class="table">

    <div class="player player2" id="player2">
        <div class="player-name" id="player2Name">
            Player 2
        </div>

        <div class="coins-area">
            <div class="coin-stack" id="stack2"></div>
            <div class="coin-count" id="coins2">8</div>
        </div>
    </div>

    <div class="dice-scene">

        <div class="dice-shadow"></div>

        <div class="dice" id="dice" onclick="rollDice()">

            <div class="face face1 one">
                <span class="dot d1"></span>
            </div>

            <div class="face face2 two">
                <span class="dot d1"></span>
                <span class="dot d2"></span>
            </div>

            <div class="face face3 three">
                <span class="dot d1"></span>
                <span class="dot d2"></span>
                <span class="dot d3"></span>
            </div>

            <div class="face face4 four">
                <span class="dot d1"></span>
                <span class="dot d2"></span>
                <span class="dot d3"></span>
                <span class="dot d4"></span>
            </div>

            <div class="face face5 five">
                <span class="dot d1"></span>
                <span class="dot d2"></span>
                <span class="dot d3"></span>
                <span class="dot d4"></span>
                <span class="dot d5"></span>
            </div>

            <div class="face face6 six">
                <span class="dot d1"></span>
                <span class="dot d2"></span>
                <span class="dot d3"></span>
                <span class="dot d4"></span>
                <span class="dot d5"></span>
                <span class="dot d6"></span>
            </div>

        </div>
    </div>

    <div class="player player1" id="player1">

        <div class="coins-area">
            <div class="coin-stack" id="stack1"></div>
            <div class="coin-count" id="coins1">8</div>
        </div>

        <div class="player-name" id="player1Name">
            Player 1
        </div>

    </div>

    <button id="settingsButton" onclick="openSettings()">⚙️</button>

    <button id="restart" onclick="restart()">↻</button>


    <!-- =========================
         شاشة البداية
    ========================== -->

    <div id="startScreen">

        <div class="start-box">

            <h2>🎲 لعبة النرد</h2>

            <button
                class="menu-button online-button"
                onclick="startOnlineSearch()">
                🎮 لعب أونلاين
            </button>

            <button
                class="menu-button friend-button"
                onclick="showFriendMenu()">
                👥 لعب مع صديق
            </button>

            <button
                class="menu-button local-button"
                onclick="showLocalSettings()">
                👥 لعب محلي
            </button>

            <div id="localSettings">

                <h3>عدد العملات</h3>

                <div class="coin-choice">

                    <button onclick="changeStartingCoins(-1)">
                        −
                    </button>

                    <div id="startingCoins">
                        8
                    </div>

                    <button onclick="changeStartingCoins(1)">
                        +
                    </button>

                </div>

                <div style="margin-bottom:18px;">
                    كل لاعب يبدأ بـ
                    <b id="startText">8</b>
                    عملات
                </div>

                <button id="startGame" onclick="startGame()">
                    ابدأ الجولة
                </button>
            </div>

        </div>
    </div>


    <!-- =========================
         لعب مع صديق
    ========================== -->

    <div id="friendScreen">

        <div class="friend-box">

            <h2>👥 لعب مع صديق</h2>

            <button
                class="menu-button create-room-button"
                onclick="createRoom()">
                ➕ إنشاء غرفة
            </button>

            <button
                class="menu-button join-room-button"
                onclick="showJoinRoom()">
                🔑 دخول إلى غرفة
            </button>

            <button
                class="menu-button back-button"
                onclick="closeFriendMenu()">
                رجوع
            </button>

        </div>
    </div>


    <!-- =========================
         دخول إلى غرفة
    ========================== -->

    <div id="roomScreen">

        <div class="room-box" id="joinRoomBox">

            <h2>🔑 دخول إلى غرفة</h2>

            <p>
                أدخل رقم الغرفة الذي أرسله لك صديقك
            </p>

            <input
                id="roomCodeInput"
                type="tel"
                inputmode="numeric"
                maxlength="6"
                placeholder="رقم الغرفة">

            <button
                class="menu-button join-room-button"
                onclick="joinRoom()">
                دخول إلى الغرفة
            </button>

            <button
                class="menu-button back-button"
                onclick="closeRoomScreen()">
                رجوع
            </button>

        </div>


        <div class="room-box" id="createRoomBox" style="display:none;">

            <h2>🏠 الغرفة</h2>

            <div>
                رقم الغرفة:
            </div>

            <div
                class="room-code"
                id="roomCode">
                ------
            </div>

            <div class="room-info" id="roomStatus">
                جاري إنشاء الغرفة...
            </div>

            <button
                class="menu-button back-button"
                onclick="cancelRoom()">
                إلغاء
            </button>

        </div>

    </div>


    <!-- =========================
         الإعدادات
    ========================== -->

    <div id="settingsScreen">

        <div class="settings-box">

            <h2>⚙️ الإعدادات</h2>

            <div style="margin-bottom:8px;">
                اسم اللاعب
            </div>

            <input
                id="playerNameInput"
                type="text"
                maxlength="20"
                placeholder="اكتب اسمك">

            <button
                class="settings-button save-name"
                onclick="savePlayerName()">
                حفظ الاسم
            </button>

            <button
                class="settings-button close-settings"
                onclick="closeSettings()">
                إغلاق
            </button>

        </div>
    </div>


    <!-- =========================
         البحث العشوائي
    ========================== -->

    <div id="onlineScreen">

        <div class="online-box">

            <div class="search-icon">🔎</div>

            <h2 id="onlineTitle">
                جاري البحث...
            </h2>

            <p id="onlineText">
                نبحث عن لاعب متصل للعب معك.
            </p>

            <button
                id="cancelOnline"
                onclick="cancelOnlineSearch()">
                إلغاء البحث
            </button>

        </div>
    </div>

</div>


<script>

let coins1 = 8;
let coins2 = 8;

let startingCoins = 8;

let currentPlayer = 1;

let audioCtx = null;
let soundTimer = null;
let rollTimer = null;

let gameStarted = false;

let onlineGame = false;
let onlineSearching = false;

let myPlayer = null;
let socket = null;

let playerName = "Player 1";


/* =========================
   اسم اللاعب
========================= */

try{

    const savedName =
        localStorage.getItem("playerName");

    if(
        savedName &&
        savedName.trim() !== ""
    ){

        playerName =
            savedName.trim();
    }

}catch(e){

    playerName = "Player 1";
}


function updatePlayerName(){

    document.getElementById(
        "player1Name"
    ).textContent = playerName;
}


function updateOnlineNames(myName, opponentName){

    if(myPlayer === 1){

        document.getElementById(
            "player1Name"
        ).textContent = myName;

        document.getElementById(
            "player2Name"
        ).textContent = opponentName;

    }else if(myPlayer === 2){

        document.getElementById(
            "player1Name"
        ).textContent = opponentName;

        document.getElementById(
            "player2Name"
        ).textContent = myName;
    }
}


function openSettings(){

    if(gameStarted || onlineGame || onlineSearching)
        return;

    document.getElementById(
        "playerNameInput"
    ).value = playerName;

    document.getElementById(
        "settingsScreen"
    ).style.display = "flex";
}


function closeSettings(){

    document.getElementById(
        "settingsScreen"
    ).style.display = "none";
}


function savePlayerName(){

    const input =
        document.getElementById(
            "playerNameInput"
        );

    let name =
        input.value.trim();

    if(name === ""){
        name = "Player 1";
    }

    if(name.length > 20){
        name = name.substring(0,20);
    }

    playerName = name;

    try{

        localStorage.setItem(
            "playerName",
            playerName
        );

    }catch(e){}

    updatePlayerName();

    closeSettings();
}


/* =========================
   قائمة لعب مع صديق
========================= */

function showFriendMenu(){

    if(gameStarted || onlineGame || onlineSearching)
        return;

    document.getElementById(
        "startScreen"
    ).style.display = "none";

    document.getElementById(
        "friendScreen"
    ).style.display = "flex";
}


function closeFriendMenu(){

    document.getElementById(
        "friendScreen"
    ).style.display = "none";

    document.getElementById(
        "startScreen"
    ).style.display = "flex";
}


/* =========================
   إنشاء غرفة
========================= */

function createRoom(){

    document.getElementById(
        "friendScreen"
    ).style.display = "none";

    document.getElementById(
        "roomScreen"
    ).style.display = "flex";

    document.getElementById(
        "joinRoomBox"
    ).style.display = "none";

    document.getElementById(
        "createRoomBox"
    ).style.display = "block";

    document.getElementById(
        "roomCode"
    ).textContent = "------";

    document.getElementById(
        "roomStatus"
    ).textContent =
        "جاري الاتصال بالسيرفر...";

    connectFriendServer("create_room");
}


/* =========================
   إظهار دخول الغرفة
========================= */

function showJoinRoom(){

    document.getElementById(
        "friendScreen"
    ).style.display = "none";

    document.getElementById(
        "roomScreen"
    ).style.display = "flex";

    document.getElementById(
        "joinRoomBox"
    ).style.display = "block";

    document.getElementById(
        "createRoomBox"
    ).style.display = "none";

    document.getElementById(
        "roomCodeInput"
    ).value = "";
}


/* =========================
   دخول الغرفة
========================= */

function joinRoom(){

    const input =
        document.getElementById(
            "roomCodeInput"
        );

    const code =
        input.value.trim();

    if(code.length < 4){

        alert("أدخل رقم الغرفة بشكل صحيح");

        return;
    }

    document.getElementById(
        "joinRoomBox"
    ).style.display = "none";

    document.getElementById(
        "createRoomBox"
    ).style.display = "block";

    document.getElementById(
        "roomCode"
    ).textContent = code;

    document.getElementById(
        "roomStatus"
    ).textContent =
        "جاري دخول الغرفة...";

    connectFriendServer(
        "join_room",
        code
    );
}


/* =========================
   اتصال لعب مع صديق
========================= */

function connectFriendServer(type, roomCode = null){

    if(socket){

        try{
            socket.close();
        }catch(e){}

        socket = null;
    }

    socket =
        new WebSocket(
            "wss://dice-game-ws.onrender.com"
        );


    socket.onopen = function(){

        if(type === "create_room"){

            socket.send(
                JSON.stringify({
                    type:"create_room",
                    name:playerName
                })
            );

        }

        else if(type === "join_room"){

            socket.send(
                JSON.stringify({
                    type:"join_room",
                    name:playerName,
                    roomCode:roomCode
                })
            );
        }
    };


    socket.onmessage = function(event){

        let data;

        try{

            data =
                JSON.parse(event.data);

        }catch(e){

            return;
        }


        /* غرفة تم إنشاؤها */

        if(data.type === "room_created"){

            document.getElementById(
                "roomCode"
            ).textContent =
                data.roomCode;

            document.getElementById(
                "roomStatus"
            ).textContent =
                "⏳ أرسل رقم الغرفة لصديقك وانتظر دخوله.";

            return;
        }


        /* انتظار */

        if(data.type === "room_waiting"){

            document.getElementById(
                "roomStatus"
            ).textContent =
                "⏳ في انتظار دخول صديقك...";

            return;
        }


        /* خطأ */

        if(data.type === "room_error"){

            alert(
                data.message ||
                "حدث خطأ في الغرفة"
            );

            cancelRoom();

            return;
        }


        /* بدأت المباراة */

        if(data.type === "matched"){

            onlineGame = true;

            onlineSearching = false;

            myPlayer = data.player;

            updateOnlineNames(
                data.myName,
                data.opponentName
            );

            coins1 = 8;
            coins2 = 8;

            currentPlayer = 1;

            gameStarted = true;

            drawCoins();

            updateActivePlayer();

            document.getElementById(
                "roomScreen"
            ).style.display = "none";

            document.getElementById(
                "startScreen"
            ).style.display = "none";

            document.getElementById(
                "settingsButton"
            ).style.display = "none";

            return;
        }


        /* حالة اللعبة */

        if(data.type === "game_state"){

            onlineGame = true;

            updateOnlineNames(
                myPlayer === 1
                ? data.player1Name
                : data.player2Name,

                myPlayer === 1
                ? data.player2Name
                : data.player1Name
            );

            coins1 = data.coins1;
            coins2 = data.coins2;

            currentPlayer =
                data.currentPlayer;

            gameStarted = true;

            drawCoins();

            updateActivePlayer();

            return;
        }


        /* نتيجة النرد */

        if(data.type === "dice_result"){

            const oldCoins1 = coins1;
            const oldCoins2 = coins2;

            const roller =
                data.currentPlayer;

            showDice(data.roll);


            if(
                data.roll < oldCoins2 &&
                roller === 1
            ){

                animateCoins(
                    2,
                    1,
                    data.roll
                );
            }


            if(
                data.roll < oldCoins1 &&
                roller === 2
            ){

                animateCoins(
                    1,
                    2,
                    data.roll
                );
            }


            coins1 = data.coins1;
            coins2 = data.coins2;

            if(data.player1Name &&
               data.player2Name){

                document.getElementById(
                    "player1Name"
                ).textContent =
                    data.player1Name;

                document.getElementById(
                    "player2Name"
                ).textContent =
                    data.player2Name;
            }

            drawCoins();


            if(data.winner){

                showWinner(
                    data.winner
                );

                return;
            }


            currentPlayer =
                roller === 1 ? 2 : 1;

            updateActivePlayer();

            return;
        }


        if(data.type === "opponent_disconnected"){

            onlineGame = false;

            gameStarted = false;

            showWinner(
                myPlayer
            );

            return;
        }

    };


    socket.onerror = function(){

        document.getElementById(
            "roomStatus"
        ).textContent =
            "❌ فشل الاتصال بالسيرفر";

    };


    socket.onclose = function(){

        if(!onlineGame){

            const status =
                document.getElementById(
                    "roomStatus"
                );

            if(status){

                status.textContent =
                    "❌ انقطع الاتصال بالسيرفر";
            }
        }

    };
}

function drawStack(element, amount){

/* =========================
   الصوت
========================= */

function getAudioContext(){

    if(!audioCtx){

        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    return audioCtx;
}


function diceTick(){

    const ctx = getAudioContext();

    const osc = ctx.createOscillator();

    const gain = ctx.createGain();

    osc.type = "square";

    osc.frequency.value =
        180 + Math.random()*120;

    gain.gain.value = 0.025;

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
        ctx.currentTime + 0.035
    );
}


function diceStopSound(){

    const ctx = getAudioContext();

    const osc = ctx.createOscillator();

    const gain = ctx.createGain();

    osc.frequency.value = 120;

    gain.gain.value = 0.06;

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
        ctx.currentTime + 0.12
    );
}


function winSound(){

    const ctx = getAudioContext();

    [523,659,784].forEach(
        (freq,i)=>{

            setTimeout(()=>{

                const osc =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();

                osc.frequency.value = freq;

                gain.gain.value = 0.08;

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();

                osc.stop(
                    ctx.currentTime + 0.25
                );

            },i*130);

        }
    );
}


/* =========================
   النرد
========================= */

function showDice(number){

    const dice =
        document.getElementById("dice");

    const rotations = {

        1:"rotateX(0deg) rotateY(0deg)",
        2:"rotateX(0deg) rotateY(180deg)",
        3:"rotateY(-90deg)",
        4:"rotateY(90deg)",
        5:"rotateX(-90deg)",
        6:"rotateX(90deg)"
    };

    dice.style.transform =
        rotations[number];
}


/* =========================
   حركة العملات
========================= */

function animateCoins(
    fromPlayer,
    toPlayer,
    amount
){

    const fromStack =
        document.getElementById(
            fromPlayer === 1
            ? "stack1"
            : "stack2"
        );

    const toStack =
        document.getElementById(
            toPlayer === 1
            ? "stack1"
            : "stack2"
        );

    const fromRect =
        fromStack.getBoundingClientRect();

    const toRect =
        toStack.getBoundingClientRect();

    let count =
        Math.min(amount,6);

    for(let i=0;i<count;i++){

        setTimeout(()=>{

            const coin =
                document.createElement("div");

            coin.className =
                "flying-coin";

            coin.style.left =
                (fromRect.left+12) + "px";

            coin.style.top =
                (fromRect.top+10) + "px";

            coin.style.setProperty(
                "--dx",
                (toRect.left-fromRect.left)+"px"
            );

            coin.style.setProperty(
                "--dy",
                (toRect.top-fromRect.top)+"px"
            );

            document.body.appendChild(coin);

            setTimeout(()=>{
                coin.remove();
            },750);

        },i*80);

    }
}


/* =========================
   الفوز
========================= */

function showWinner(player){

    if(document.querySelector(".win-message"))
        return;

    const overlay =
        document.createElement("div");

    overlay.className =
        "win-message";

    let winnerName;

    if(
        onlineGame &&
        document.getElementById("player1Name") &&
        document.getElementById("player2Name")
    ){

        winnerName =
            player === 1
            ? document.getElementById("player1Name").textContent
            : document.getElementById("player2Name").textContent;

    }else{

        winnerName =
            player === 1
            ? playerName
            : "Player 2";
    }


    overlay.innerHTML = `
        <div class="win-box">
            🏆<br>
            ${winnerName} فاز!
            <br>
            <button onclick="restart()">
                جولة جديدة
            </button>
        </div>
    `;

    document
        .querySelector(".table")
        .appendChild(overlay);

    winSound();
}


/* =========================
   اللعب المحلي
========================= */

function localRoll(){

    const dice =
        document.getElementById("dice");

    dice.classList.add("rolling");

    soundTimer =
        setInterval(
            diceTick,
            140
        );

    rollTimer =
        setTimeout(()=>{

            clearInterval(soundTimer);

            dice.classList.remove("rolling");

            diceStopSound();

            const roll =
                Math.floor(
                    Math.random()*6
                )+1;

            showDice(roll);

            applyLocalResult(roll);

        },1200);
}


function applyLocalResult(roll){

    let opponentCoins =
        currentPlayer === 1
        ? coins2
        : coins1;


    if(roll === opponentCoins){

        showWinner(currentPlayer);

        return;
    }


    if(roll < opponentCoins){

        if(currentPlayer === 1){

            animateCoins(2,1,roll);

            coins2 -= roll;
            coins1 += roll;

        }else{

            animateCoins(1,2,roll);

            coins1 -= roll;
            coins2 += roll;
        }
    }


    drawCoins();

    currentPlayer =
        currentPlayer === 1 ? 2 : 1;

    updateActivePlayer();
}


/* =========================
   رمي النرد
========================= */

function rollDice(){

    if(!gameStarted && !onlineGame)
        return;

    if(
        document.querySelector(".win-message")
    )
        return;


    const dice =
        document.getElementById("dice");


    if(dice.classList.contains("rolling"))
        return;


    if(onlineGame){

        if(!socket ||
           socket.readyState !== WebSocket.OPEN){

            return;
        }


        if(currentPlayer !== myPlayer)
            return;


        dice.classList.add("rolling");

        soundTimer =
            setInterval(
                diceTick,
                140
            );

        rollTimer =
            setTimeout(()=>{

                clearInterval(soundTimer);

                dice.classList.remove("rolling");

                diceStopSound();

                socket.send(
                    JSON.stringify({
                        type:"roll"
                    })
                );

            },1200);

        return;
    }


    localRoll();
}


/* =========================
   الأونلاين العشوائي
========================= */

function connectToServer(){

    onlineStatus(
        "جاري الاتصال بالسيرفر..."
    );


    socket =
        new WebSocket(
            "wss://dice-game-ws.onrender.com"
        );


    socket.onopen = function(){

        onlineStatus(
            "🔎 جاري البحث عن لاعب..."
        );

        socket.send(
            JSON.stringify({
                type:"find_match",
                name:playerName
            })
        );
    };


    socket.onmessage = function(event){

        let data;

        try{

            data =
                JSON.parse(event.data);

        }catch(error){

            return;
        }


        if(data.type === "connected"){
            return;
        }


        if(data.type === "waiting"){

            onlineStatus(
                "⏳ في انتظار لاعب آخر..."
            );

            return;
        }


        if(data.type === "matched"){

            onlineGame = true;

            onlineSearching = false;

            myPlayer = data.player;

            updateOnlineNames(
                data.myName,
                data.opponentName
            );

            coins1 = 8;
            coins2 = 8;

            currentPlayer = 1;

            gameStarted = true;

            drawCoins();

            updateActivePlayer();

            document.getElementById(
                "onlineScreen"
            ).style.display = "none";

            document.getElementById(
                "startScreen"
            ).style.display = "none";

            document.getElementById(
                "settingsButton"
            ).style.display = "none";

            return;
        }


        if(data.type === "game_state"){

            onlineGame = true;

            updateOnlineNames(
                myPlayer === 1
                ? data.player1Name
                : data.player2Name,

                myPlayer === 1
                ? data.player2Name
                : data.player1Name
            );

            coins1 = data.coins1;
            coins2 = data.coins2;

            currentPlayer =
                data.currentPlayer;

            gameStarted = true;

            drawCoins();

            updateActivePlayer();

            return;
        }


        if(data.type === "dice_result"){

            const oldCoins1 = coins1;
            const oldCoins2 = coins2;

            const roller =
                data.currentPlayer;

            showDice(data.roll);


            if(
                data.roll < oldCoins2 &&
                roller === 1
            ){

                animateCoins(
                    2,
                    1,
                    data.roll
                );
            }


            if(
                data.roll < oldCoins1 &&
                roller === 2
            ){

                animateCoins(
                    1,
                    2,
                    data.roll
                );
            }


            coins1 = data.coins1;
            coins2 = data.coins2;

            if(
                data.player1Name &&
                data.player2Name
            ){

                document.getElementById(
                    "player1Name"
                ).textContent =
                    data.player1Name;

                document.getElementById(
                    "player2Name"
                ).textContent =
                    data.player2Name;
            }

            drawCoins();


            if(data.winner){

                showWinner(
                    data.winner
                );

                return;
            }


            currentPlayer =
                roller === 1 ? 2 : 1;

            updateActivePlayer();

            return;
        }


        if(data.type === "opponent_disconnected"){

            onlineGame = false;

            gameStarted = false;

            showWinner(
                myPlayer
            );

            return;
        }

    };


    socket.onerror = function(){

        onlineStatus(
            "❌ فشل الاتصال بالسيرفر"
        );

    };


    socket.onclose = function(){

        if(onlineSearching){

            onlineStatus(
                "❌ انقطع الاتصال بالسيرفر"
            );
        }

    };
}
